name: SIREADER Virtual Office CI

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-2-batch-1-bff-foundation
      - phase-3-3-sse-implementation
      - phase-4-implementation
      - phase-5-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sireader-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run complete automated test suite
        run: bun run test

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build
